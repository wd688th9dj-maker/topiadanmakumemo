<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>トピア弾幕メモ</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #000000;
  --panel: #161616;
  --panel2: #202020;
  --border: #333333;
  --text: #ffffff;
  --sub: #aaaaaa;
  --accent: #4370BD;
  --danger: #ff453a;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #000000;
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
}

body {
  padding:
    env(safe-area-inset-top)
    0
    env(safe-area-inset-bottom);
}

button,
input,
textarea {
  font: inherit;
}


/* ==============================
   共通
============================== */

.screen {
  display: none;
  min-height: 100vh;
  background: #000000;
}

.screen.active {
  display: block;
}

.header {
  position: sticky;
  top: 0;
  z-index: 10;

  display: flex;
  align-items: center;
  justify-content: space-between;

  min-height: 58px;
  padding: 8px 16px;

  background: rgba(0,0,0,.92);
  backdrop-filter: blur(18px);

  border-bottom: 1px solid var(--border);
}

.header-title {
  font-size: 18px;
  font-weight: 600;
}

.header-button {
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 16px;
  padding: 10px 4px;
}

.header-space {
  width: 42px;
}

.content {
  padding: 14px 14px 100px;
}

.empty {
  color: var(--sub);
  text-align: center;
  padding: 80px 20px;
  line-height: 1.7;
}

.fab {
  position: fixed;
  right: 22px;
  bottom: calc(24px + env(safe-area-inset-bottom));

  width: 58px;
  height: 58px;

  border: 0;
  border-radius: 50%;

  background: var(--accent);
  color: #000;

  font-size: 34px;
  font-weight: 300;

  box-shadow: 0 6px 24px rgba(0,0,0,.45);
}


/* ==============================
   フォルダ
============================== */

.folder {
  display: flex;
  align-items: center;
  gap: 13px;

  padding: 17px 8px;

  border-bottom: 1px solid var(--border);
}

.folder-icon {
  color: var(--accent);
  font-size: 22px;
}

.folder-info {
  flex: 1;
  min-width: 0;
}

.folder-name {
  font-size: 17px;
  color: white;
}

.folder-count {
  margin-top: 4px;
  font-size: 13px;
  color: var(--sub);
}

.chevron {
  color: #777;
  font-size: 22px;
}


/* ==============================
   弾幕一覧
============================== */

.search {
  width: 100%;

  border: 0;
  border-radius: 11px;

  padding: 11px 13px;
  margin-bottom: 14px;

  background: var(--panel2);
  color: white;

  font-size: 16px;
  outline: none;
}

.danmaku-card {
  position: relative;

  margin-bottom: 9px;
  padding: 16px 46px 16px 15px;

  border: 1px solid #282828;
  border-radius: 12px;

  background: var(--panel);

  overflow-wrap: anywhere;
  white-space: pre-wrap;

  line-height: 1.5;
}

.danmaku-card,
.danmaku-card * {
  font-size: 14px !important;
}

.danmaku-card:active {
  opacity: .65;
}

.more {
  position: absolute;
  right: 7px;
  top: 50%;

  transform: translateY(-50%);

  border: 0;
  background: none;

  color: #888;
  font-size: 22px;

  padding: 12px;
}


/* ==============================
   編集
============================== */

.editor {
  width: 100%;
  min-height: 240px;

  resize: vertical;

  border: 1px solid var(--border);
  border-radius: 13px;

  padding: 15px;

  background: var(--panel);
  color: white;

  outline: none;

  font-size: 16px;
  line-height: 1.5;
}

.editor:focus {
  border-color: #666;
}


/* ==============================
   編集 / プレビュー切替
============================== */

.mode-switch {
  display: flex;

  width: 100%;
  height: 42px;

  margin-bottom: 18px;
  padding: 3px;

  background: var(--panel);

  border: 1px solid var(--border);
  border-radius: 14px;
}

.mode-btn {
  flex: 1;

  border: 0;
  border-radius: 11px;

  background: transparent;
  color: var(--sub);

  font-size: 15px;
  font-weight: 600;
}

.mode-btn.active {
  background: var(--panel2);
  color: var(--accent);
}


/* ==============================
   TOPIA風プレビュー
============================== */

#previewMode {
  position: relative;

  width: 100%;
  aspect-ratio: 9 / 19.5;

  margin: 0 auto;

  background-color: #000000;

  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  border-radius: 12px;

  overflow: hidden;
}


/* TOPIA風コメント */

.preview {
  position: relative;

  left: auto;
  bottom: auto;

  width: fit-content;
  max-width: calc(100% - 28px);

  min-height: 0;

  margin:
    calc(100% * 1.72)
    14px
    90px;

  padding: 6px 10px;

  border: 0;
  border-radius: 14px;

  background: rgba(24,24,24,.56);
  color: white;

  font-size: 14px;
  line-height: 1.28;

  white-space: pre-wrap;
  overflow-wrap: anywhere;

  z-index: 100;
}


/* 背景ボタン */

.preview-bg-button {
  position: absolute;

  top: 12px;
  right: 12px;

  z-index: 101;

  border: 0;
  border-radius: 12px;

  padding: 9px 13px;

  background: rgba(0,0,0,.58);
  color: white;

  font-size: 14px;
}


/* ==============================
   下から出るメニュー
============================== */

.edit-menu {
  display: none;

  position: fixed;
  inset: 0;

  background: rgba(0,0,0,.45);

  z-index: 1000;

  align-items: flex-end;
  justify-content: center;
}

.edit-menu.show {
  display: flex;
}

.edit-menu-sheet {
  width: 100%;

  background: var(--panel);

  border-radius: 18px 18px 0 0;

  padding:
    12px
    16px
    calc(28px + env(safe-area-inset-bottom));
}

.edit-menu-sheet button.menu-action {
  width: 100%;

  padding: 16px;

  border: 0;
  border-bottom: 1px solid var(--border);

  background: transparent;
  color: var(--text);

  font-size: 17px;
}

.edit-menu-sheet button.danger {
  color: #ff5a52;
}


/* ==============================
   背景設定
============================== */

.background-menu-title {
  padding: 5px 3px 14px;

  color: white;

  font-size: 17px;
  font-weight: 600;
}

.background-setting {
  padding: 14px 0;

  border-bottom: 1px solid var(--border);
}

.background-label {
  margin-bottom: 10px;

  color: var(--sub);

  font-size: 13px;
}

.color-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.color-picker {
  width: 48px;
  height: 48px;

  padding: 0;

  border: 2px solid #555;
  border-radius: 50%;

  overflow: hidden;

  background: none;
}

.color-code {
  flex: 1;
  min-width: 0;

  border: 1px solid var(--border);
  border-radius: 10px;

  padding: 12px;

  background: var(--panel2);
  color: white;

  outline: none;

  font-size: 16px;
}

.background-photo-button {
  width: 100%;

  border: 0;
  border-radius: 11px;

  padding: 14px;

  background: var(--panel2);
  color: white;

  font-size: 16px;
}

.background-photo-button +
.background-photo-button {
  margin-top: 8px;
}

.background-photo-button.danger {
  color: var(--danger);
}


/* ==============================
   Toast
============================== */

.toast {
  position: fixed;

  left: 50%;
  bottom: calc(100px + env(safe-area-inset-bottom));

  transform:
    translateX(-50%)
    translateY(20px);

  padding: 10px 17px;

  border-radius: 20px;

  background: #eee;
  color: #111;

  font-size: 14px;

  opacity: 0;
  pointer-events: none;

  transition: .2s;

  z-index: 2000;
}

.toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}

</style>
</head>

<body>


<!-- ==============================
     フォルダ一覧
============================== -->

<section
  id="foldersScreen"
  class="screen active"
>

  <header class="header">

    <div class="header-space"></div>

    <div class="header-title">
      フォルダ
    </div>

    <div class="header-space"></div>

  </header>

  <main
    id="folderList"
    class="content"
  ></main>

  <button
    class="fab"
    onclick="addFolder()"
  >
    ＋
  </button>

</section>


<!-- ==============================
     弾幕一覧
============================== -->

<section
  id="listScreen"
  class="screen"
>

  <header class="header">

    <button
      class="header-button"
      onclick="showFolders()"
    >
      ‹ フォルダ
    </button>

    <div
      id="currentFolderName"
      class="header-title"
    ></div>

    <button
      class="header-button"
      onclick="renameFolder()"
    >
      •••
    </button>

  </header>

  <main class="content">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="検索"
      oninput="renderDanmaku()"
    >

    <div id="danmakuList"></div>

  </main>

  <button
    class="fab"
    onclick="newDanmaku()"
  >
    ＋
  </button>

  <div
    id="listMenu"
    class="edit-menu"
    onclick="closeListMenu()"
  >

    <div
      class="edit-menu-sheet"
      onclick="event.stopPropagation()"
    >

      <button
        class="menu-action"
        onclick="copyListItem()"
      >
        コピー
      </button>

      <button
        class="menu-action danger"
        onclick="deleteListItem()"
      >
        削除
      </button>

    </div>

  </div>

</section>


<!-- ==============================
     編集
============================== -->

<section
  id="editScreen"
  class="screen"
>

  <header class="header">

    <button
      class="header-button"
      onclick="closeEditor()"
    >
      ‹ 戻る
    </button>

    <div class="header-title">
      編集
    </div>

    <button
      class="header-button"
      onclick="openEditMenu()"
    >
      •••
    </button>

  </header>

  <main class="content">

    <div class="mode-switch">

      <button
        id="editModeBtn"
        class="mode-btn active"
        onclick="setEditMode('edit')"
      >
        編集
      </button>

      <button
        id="previewModeBtn"
        class="mode-btn"
        onclick="setEditMode('preview')"
      >
        プレビュー
      </button>

    </div>


    <div id="editMode">

      <textarea
        id="editor"
        class="editor"
        placeholder="弾幕を入力"
        oninput="editorChanged()"
      ></textarea>

    </div>


    <div
      id="previewMode"
      style="display:none;"
    >

      <button
        class="preview-bg-button"
        onclick="openBackgroundMenu()"
      >
        背景
      </button>

      <div
        id="preview"
        class="preview"
      ></div>

    </div>

  </main>


  <div
    id="editMenu"
    class="edit-menu"
    onclick="closeEditMenu()"
  >

    <div
      class="edit-menu-sheet"
      onclick="event.stopPropagation()"
    >

      <button
        class="menu-action"
        onclick="copyCurrent(); closeEditMenu()"
      >
        コピー
      </button>

      <button
        class="menu-action danger"
        onclick="deleteCurrent(); closeEditMenu()"
      >
        削除
      </button>

    </div>

  </div>


  <div
    id="backgroundMenu"
    class="edit-menu"
    onclick="closeBackgroundMenu()"
  >

    <div
      class="edit-menu-sheet"
      onclick="event.stopPropagation()"
    >

      <div class="background-menu-title">
        プレビュー背景
      </div>

      <div class="background-setting">

        <div class="background-label">
          背景色
        </div>

        <div class="color-row">

          <input
            id="backgroundPicker"
            class="color-picker"
            type="color"
            value="#000000"
            oninput="pickerChanged()"
          >

          <input
            id="backgroundCode"
            class="color-code"
            value="#000000"
            maxlength="7"
            oninput="codeChanged()"
          >

        </div>

      </div>

      <div class="background-setting">

        <div class="background-label">
          背景画像
        </div>

        <button
          class="background-photo-button"
          onclick="document.getElementById('backgroundImage').click()"
        >
          写真を選ぶ
        </button>

        <input
          id="backgroundImage"
          type="file"
          accept="image/*"
          onchange="imageChanged(event)"
          hidden
        >

        <button
          class="background-photo-button danger"
          onclick="removeBackgroundImage()"
        >
          写真を削除
        </button>

      </div>

    </div>

  </div>

</section>


<div
  id="toast"
  class="toast"
>
  コピーしました
</div>


<script>

/* ==============================
   編集 / プレビュー
============================== */

function setEditMode(mode) {

  const editMode =
    document.getElementById("editMode");

  const previewMode =
    document.getElementById("previewMode");

  const editBtn =
    document.getElementById("editModeBtn");

  const previewBtn =
    document.getElementById("previewModeBtn");


  if (mode === "edit") {

    editMode.style.display = "block";
    previewMode.style.display = "none";

    editBtn.classList.add("active");
    previewBtn.classList.remove("active");

  } else {

    editMode.style.display = "none";
    previewMode.style.display = "block";

    applyBackground();

    editBtn.classList.remove("active");
    previewBtn.classList.add("active");

  }
}


/* ==============================
   編集メニュー
============================== */

function openEditMenu() {

  document
    .getElementById("editMenu")
    .classList.add("show");
}

function closeEditMenu() {

  document
    .getElementById("editMenu")
    .classList.remove("show");
}


/* ==============================
   背景メニュー
============================== */

function openBackgroundMenu() {

  syncBackgroundControls();

  document
    .getElementById("backgroundMenu")
    .classList.add("show");
}

function closeBackgroundMenu() {

  document
    .getElementById("backgroundMenu")
    .classList.remove("show");
}


/* ==============================
   一覧メニュー
============================== */

let listMenuItemId = null;

function openListMenu(itemId) {

  listMenuItemId = itemId;

  document
    .getElementById("listMenu")
    .classList.add("show");
}

function closeListMenu() {

  document
    .getElementById("listMenu")
    .classList.remove("show");

  listMenuItemId = null;
}

function copyListItem() {

  const folder =
    getCurrentFolder();

  if (!folder) return;

  const item =
    folder.items.find(
      i => i.id === listMenuItemId
    );

  if (!item) return;

  copyText(item.text);

  closeListMenu();
}

function deleteListItem() {

  const folder =
    getCurrentFolder();

  if (!folder) return;

  if (
    !confirm(
      "この弾幕を削除しますか？"
    )
  ) {
    return;
  }

  folder.items =
    folder.items.filter(
      i => i.id !== listMenuItemId
    );

  saveData();

  renderDanmaku();

  closeListMenu();
}


/* ==============================
   データ
============================== */

const STORAGE_KEY =
  "danmakuMemoData_v1";

let data =
  loadData();

let currentFolderId =
  null;

let currentDanmakuId =
  null;


function defaultData() {

  return {

    folders: [
      {
        id: makeId(),
        name: "弾幕",
        items: []
      }
    ],

    settings: {
      backgroundColor: "#000000",
      backgroundImage: ""
    }

  };
}


function loadData() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (saved) {

      const parsed =
        JSON.parse(saved);

      if (!parsed.settings) {

        parsed.settings = {
          backgroundColor: "#000000",
          backgroundImage: ""
        };
      }

      return parsed;
    }

  } catch (e) {}

  return defaultData();
}


function saveData() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  } catch (e) {

    console.error(e);

    showToast(
      "保存容量が足りない可能性があります"
    );
  }

  applyBackground();
}


function makeId() {

  return (
    Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .slice(2)
  );
}


/* ==============================
   画面
============================== */

function showScreen(id) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {

      screen.classList.remove(
        "active"
      );

    });

  document
    .getElementById(id)
    .classList.add("active");
}


function showFolders() {

  currentFolderId = null;

  renderFolders();

  showScreen(
    "foldersScreen"
  );
}


/* ==============================
   フォルダ
============================== */

function renderFolders() {

  const list =
    document.getElementById(
      "folderList"
    );

  list.innerHTML = "";

  if (!data.folders.length) {

    list.innerHTML =
      '<div class="empty">フォルダがありません。<br>＋から作成できます。</div>';

    return;
  }

  data.folders.forEach(
    folder => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "folder";

      row.innerHTML = `
        <div class="folder-icon">
          ▱
        </div>

        <div class="folder-info">

          <div class="folder-name"></div>

          <div class="folder-count">
            ${folder.items.length}件
          </div>

        </div>

        <div class="chevron">
          ›
        </div>
      `;

      row
        .querySelector(
          ".folder-name"
        )
        .textContent =
          folder.name;

      row.onclick =
        () =>
          openFolder(
            folder.id
          );

      list.appendChild(
        row
      );
    }
  );
}


function addFolder() {

  const name =
    prompt("フォルダ名");

  if (
    !name ||
    !name.trim()
  ) {
    return;
  }

  data.folders.push({
    id: makeId(),
    name: name.trim(),
    items: []
  });

  saveData();

  renderFolders();
}


function openFolder(id) {

  currentFolderId = id;

  const folder =
    getCurrentFolder();

  if (!folder) return;

  document
    .getElementById(
      "currentFolderName"
    )
    .textContent =
      folder.name;

  document
    .getElementById(
      "search"
    )
    .value = "";

  renderDanmaku();

  showScreen(
    "listScreen"
  );
}


function renameFolder() {

  const folder =
    getCurrentFolder();

  if (!folder) return;

  const action =
    prompt(
      "フォルダ名を変更できます。\n削除する場合は「削除」と入力してください。",
      folder.name
    );

  if (action === null) {
    return;
  }

  if (action === "削除") {

    if (
      !confirm(
        "このフォルダと中の弾幕を削除しますか？"
      )
    ) {
      return;
    }

    data.folders =
      data.folders.filter(
        f => f.id !== folder.id
      );

    saveData();

    showFolders();

    return;
  }

  if (action.trim()) {

    folder.name =
      action.trim();

    saveData();

    document
      .getElementById(
        "currentFolderName"
      )
      .textContent =
        folder.name;
  }
}


function getCurrentFolder() {

  return data.folders.find(
    f => f.id === currentFolderId
  );
}


/* ==============================
   弾幕
============================== */

function renderDanmaku() {

  const folder =
    getCurrentFolder();

  if (!folder) return;

  const container =
    document.getElementById(
      "danmakuList"
    );

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  container.innerHTML = "";

  const items =
    folder.items.filter(
      item =>
        item.text
          .toLowerCase()
          .includes(query)
    );

  if (!items.length) {

    container.innerHTML =
      '<div class="empty">弾幕がありません。<br>＋から追加できます。</div>';

    return;
  }

  items.forEach(
    item => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "danmaku-card";

      const content =
        document.createElement(
          "div"
        );

      content.innerHTML =
        parseDanmaku(
          item.text
        );

      card.appendChild(
        content
      );

      const more =
        document.createElement(
          "button"
        );

      more.className =
        "more";

      more.textContent =
        "•••";

      more.onclick =
        event => {

          event.stopPropagation();

          openListMenu(
            item.id
          );
        };

      card.appendChild(
        more
      );

      card.onclick =
        () =>
          editDanmaku(
            item.id
          );

      container.appendChild(
        card
      );
    }
  );
}


function newDanmaku() {

  const folder =
    getCurrentFolder();

  if (!folder) return;

  const item = {
    id: makeId(),
    text: ""
  };

  folder.items.push(
    item
  );

  currentDanmakuId =
    item.id;

  saveData();

  openEditor(
    item
  );
}


function editDanmaku(id) {

  const folder =
    getCurrentFolder();

  if (!folder) return;

  const item =
    folder.items.find(
      i => i.id === id
    );

  if (!item) return;

  currentDanmakuId =
    id;

  openEditor(
    item
  );
}


function openEditor(item) {

  document
    .getElementById(
      "editor"
    )
    .value =
      item.text;

  updatePreview();

  showScreen(
    "editScreen"
  );

  setEditMode(
    "edit"
  );

  setTimeout(
    () => {

      document
        .getElementById(
          "editor"
        )
        .focus();

    },
    100
  );
}


function editorChanged() {

  const folder =
    getCurrentFolder();

  if (!folder) return;

  const item =
    folder.items.find(
      i =>
        i.id ===
        currentDanmakuId
    );

  if (!item) return;

  item.text =
    document
      .getElementById(
        "editor"
      )
      .value;

  saveData();

  updatePreview();
}


function closeEditor() {

  const folder =
    getCurrentFolder();

  if (folder) {

    folder.items =
      folder.items.filter(
        item =>
          item.text.trim() !== ""
      );

    saveData();

    renderDanmaku();
  }

  currentDanmakuId =
    null;

  showScreen(
    "listScreen"
  );
}


function deleteCurrent() {

  const folder =
    getCurrentFolder();

  if (!folder) return;

  if (
    !confirm(
      "この弾幕を削除しますか？"
    )
  ) {
    return;
  }

  folder.items =
    folder.items.filter(
      item =>
        item.id !==
        currentDanmakuId
    );

  saveData();

  currentDanmakuId =
    null;

  renderDanmaku();

  showScreen(
    "listScreen"
  );
}


/* ==============================
   タグ変換
============================== */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}


function validColor(color) {

  return /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/
    .test(color);
}


function parseDanmaku(source) {

  let text =
    escapeHTML(
      source
    );


  text =
    text.replace(

      /&lt;color=(#[0-9a-fA-F]{3,8})&gt;([\s\S]*?)&lt;\/color&gt;/gi,

      (
        match,
        color,
        content
      ) => {

        if (
          !validColor(color)
        ) {
          return content;
        }

        return `<span style="color:${color}">${content}</span>`;
      }
    );


  text =
    text.replace(

      /&lt;size=(\d+(?:\.\d+)?)&gt;([\s\S]*?)&lt;\/size&gt;/gi,

      (
        match,
        size,
        content
      ) => {

        const number =
          Math.max(
            1,
            Math.min(
              Number(size),
              100
            )
          );

        return `<span style="font-size:${number * 0.75}px">${content}</span>`;
      }
    );


  text =
    text.replace(

      /&lt;i&gt;([\s\S]*?)&lt;\/i&gt;/gi,

      "<i>$1</i>"
    );


  text =
    text.replace(

      /\\ua|\r\n|\r|\n/g,

      "<br>"
    );

  return text;
}


function updatePreview() {

  const text =
    document
      .getElementById(
        "editor"
      )
      .value;

  document
    .getElementById(
      "preview"
    )
    .innerHTML =
      parseDanmaku(
        text
      );
}


/* ==============================
   コピー
============================== */

function prepareCopy(text) {

  return text
    .replace(
      /\\ua\r?\n/g,
      "\n"
    )
    .replace(
      /\r\n|\r|\n/g,
      "\\ua"
    );
}


async function copyText(text) {

  const output =
    prepareCopy(
      text
    );

  try {

    await navigator
      .clipboard
      .writeText(
        output
      );

    showToast(
      "コピーしました"
    );

  } catch (e) {

    const area =
      document.createElement(
        "textarea"
      );

    area.value =
      output;

    document.body
      .appendChild(
        area
      );

    area.select();

    document.execCommand(
      "copy"
    );

    area.remove();

    showToast(
      "コピーしました"
    );
  }
}


function copyCurrent() {

  const text =
    document
      .getElementById(
        "editor"
      )
      .value;

  copyText(
    text
  );
}


/* ==============================
   プレビュー背景
============================== */

function syncBackgroundControls() {

  const color =
    data.settings.backgroundColor
    ||
    "#000000";

  const picker =
    document.getElementById(
      "backgroundPicker"
    );

  const code =
    document.getElementById(
      "backgroundCode"
    );

  if (
    /^#[0-9a-fA-F]{6}$/
      .test(color)
  ) {
    picker.value =
      color;
  }

  code.value =
    color;
}


function pickerChanged() {

  const color =
    document
      .getElementById(
        "backgroundPicker"
      )
      .value;

  document
    .getElementById(
      "backgroundCode"
    )
    .value =
      color;

  data.settings.backgroundColor =
    color;

  saveData();
}


function codeChanged() {

  const input =
    document.getElementById(
      "backgroundCode"
    );

  const color =
    input.value.trim();

  if (
    !/^#[0-9a-fA-F]{6}$/
      .test(color)
  ) {
    return;
  }

  data.settings.backgroundColor =
    color;

  document
    .getElementById(
      "backgroundPicker"
    )
    .value =
      color;

  saveData();
}


/* ==============================
   写真選択・圧縮
============================== */

function imageChanged(event) {

  const input =
    event.target;

  const file =
    input.files[0];

  if (!file) return;

  const reader =
    new FileReader();

  reader.onload =
    e => {

      const img =
        new Image();

      img.onload =
        () => {

          const maxSize =
            1500;

          let width =
            img.width;

          let height =
            img.height;


          if (
            width > height &&
            width > maxSize
          ) {

            height =
              Math.round(
                height *
                (maxSize / width)
              );

            width =
              maxSize;

          } else if (
            height >= width &&
            height > maxSize
          ) {

            width =
              Math.round(
                width *
                (maxSize / height)
              );

            height =
              maxSize;
          }


          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          const compressed =
            canvas.toDataURL(
              "image/jpeg",
              0.82
            );


          data.settings.backgroundImage =
            compressed;


          saveData();

          applyBackground();

          closeBackgroundMenu();

          input.value =
            "";
        };


      img.onerror =
        () => {

          showToast(
            "この写真は読み込めませんでした"
          );

          input.value =
            "";
        };


      img.src =
        e.target.result;
    };


  reader.onerror =
    () => {

      showToast(
        "写真の読み込みに失敗しました"
      );

      input.value =
        "";
    };


  reader.readAsDataURL(
    file
  );
}


function removeBackgroundImage() {

  data.settings.backgroundImage =
    "";

  const input =
    document.getElementById(
      "backgroundImage"
    );

  if (input) {
    input.value = "";
  }

  saveData();

  applyBackground();

  closeBackgroundMenu();
}


function applyBackground() {

  const color =
    data.settings.backgroundColor
    ||
    "#000000";

  const previewMode =
    document.getElementById(
      "previewMode"
    );

  if (!previewMode) return;


  previewMode.style.backgroundColor =
    color;


  if (
    data.settings.backgroundImage
  ) {

    previewMode.style.backgroundImage =
      `url("${data.settings.backgroundImage}")`;

    previewMode.style.backgroundSize =
      "100% 100%";

    previewMode.style.backgroundPosition =
      "center";

    previewMode.style.backgroundRepeat =
      "no-repeat";

  } else {

    previewMode.style.backgroundImage =
      "none";
  }
}


/* ==============================
   通知
============================== */

let toastTimer;


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      1300
    );
}


/* ==============================
   起動
============================== */

applyBackground();

renderFolders();

</script>
